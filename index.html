<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefall Ranch Guest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Nunito+Sans:wght@300;400;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ink:#26190F;--bg:#F6EFE3;--sand:#E9A25A;--gold:#A75C29;--lsand:#F0CFA0;--paper:#FFFDF8;--warm:#C8431E;--ice:#246681;--mut:rgba(38,25,15,.62);--line:rgba(167,92,41,.22);--c:"Nunito Sans",system-ui,sans-serif;--f:"Merriweather",Georgia,serif;--s:1}
html,body{height:100%}
body{font-variant-numeric:lining-nums;font-family:var(--c);background:#E8DDCB;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.top{height:62px;display:flex;align-items:center;gap:14px;padding:0 24px;background:var(--ink);color:#fff}
.top img{height:36px;display:block}
.top small{font-size:13.5px;color:rgba(255,255,255,.6)}
.sp{flex:1}
.tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 12px;font-weight:600}
.tag.hot{background:var(--sand);color:var(--ink);border-color:var(--sand);font-weight:700}
.tag[aria-pressed=true]{background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:236px 1fr 340px;height:calc(100% - 62px)}
body[data-notes=off] .layout{grid-template-columns:236px 1fr 0}body[data-notes=off] .notes{display:none}
.rail{padding:22px 16px;overflow:auto;border-right:1px solid rgba(167,92,41,.22);background:#F2E8D6}
.rg{margin-bottom:20px}.rg .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding:0 10px 8px;font-weight:700}
.ri{display:flex;gap:11px;align-items:center;width:100%;padding:9px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:#4a3a2a}
.ri .n{font-size:12px;color:#9a8a76;width:18px;font-variant-numeric:tabular-nums}
.ri:hover{background:rgba(38,25,15,.05)}
.ri[aria-current=true]{background:var(--ink);color:#fff}.ri[aria-current=true] .n{color:rgba(255,255,255,.55)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(900px 620px at 50% 38%,#FFFBF2,#EBDDC6)}
.pw{width:calc(390px*var(--s));height:calc(844px*var(--s));position:relative;flex:none}
.phone{width:390px;height:844px;border-radius:56px;position:absolute;top:0;left:0;transform-origin:0 0;transform:scale(var(--s));background:#000;box-shadow:0 0 0 10px #1c120a,0 0 0 11.5px var(--sand),0 60px 90px -25px rgba(38,25,15,.55)}
.screen{position:absolute;inset:0;border-radius:56px;overflow:hidden;background:var(--bg);color:var(--ink);isolation:isolate}
.hint{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:14px;color:#6a5a48}
.hint button{border:1.5px solid var(--ink);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:600;background:#fff}.hint button:disabled{opacity:.3}
.notes{padding:26px 26px 20px;overflow:auto;border-left:1px solid rgba(167,92,41,.22);background:#F2E8D6}
.notes .eb{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.notes h2{font-family:var(--f);font-weight:400;font-size:27px;margin:6px 0 8px;line-height:1.15;letter-spacing:-.01em}
.notes p.l{font-size:15px;line-height:1.55;color:#5a4838}
.notes ul{margin:14px 0 0 18px;font-size:14.5px;line-height:1.55;color:#2a1c10}.notes li{margin-bottom:8px}
.why{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--sand);box-shadow:3px 3px 0 var(--lsand)}
.why p{font-size:14.5px;line-height:1.5;margin-top:4px}
.foot{font-size:12.5px;line-height:1.55;color:#8a7a66;margin-top:20px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:8px 36px 0 40px;font-weight:600;font-size:16px;pointer-events:none;color:var(--ink);transition:color .3s}
.screen[data-th=dark] .sbar{color:#fff}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:3px;border:1.5px solid currentColor;margin-left:6px;position:relative;opacity:.9}
.sbar i:after{content:"";position:absolute;inset:1.5px;background:currentColor;border-radius:1px;width:60%}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:22px;background:#000;z-index:70;transition:width .55s cubic-bezier(.2,.9,.25,1.05),height .55s cubic-bezier(.2,.9,.25,1.05);overflow:hidden;cursor:pointer;color:#fff}
.island .in{opacity:0;transition:opacity .25s;display:flex;align-items:center;gap:12px;padding:13px 18px;white-space:nowrap}
.island.open{width:358px;height:80px;border-radius:40px}.island.open .in{opacity:1;transition-delay:.2s}
.island .ico{width:42px;height:42px;border-radius:50%;background:var(--sand);color:var(--ink);display:grid;place-items:center;flex:none}
.island b{font-size:16px;font-weight:700;display:block}.island span.s{font-size:13px;color:rgba(255,255,255,.62)}
.island .t{margin-left:auto;font-family:var(--f);font-weight:400;font-size:20px;color:var(--lsand)}
.view{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .4s,transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s .4s;background:var(--bg)}
.view.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.view.dk{background:var(--ink);color:#fff}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:64px 0 132px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.rv{opacity:0}.on .rv{animation:up .75s both cubic-bezier(.2,.8,.2,1);animation-delay:calc(var(--d,0)*65ms + 100ms)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.hd{font-family:var(--f);font-weight:400;letter-spacing:-.01em;line-height:1.1}
.hd b{font-weight:400;font-style:italic}
.h2{font-family:var(--f);font-weight:400;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.h2 b{font-weight:400;font-style:italic}
.h3{font-weight:700;font-size:16px;line-height:1.2}
.m{font-size:13.5px;color:var(--mut);line-height:1.45}
.p{font-size:15.5px;line-height:1.55}
.stk{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:var(--sand);color:var(--ink);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.stk.d{background:var(--ink);color:#fff}.stk.w{background:rgba(255,255,255,.92);color:var(--ink)}.stk.o{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px var(--sand)}.stk.gl{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}.stk.warm{background:var(--warm);color:#fff}.stk.ice{background:var(--ice);color:#06222c}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;position:relative;overflow:hidden;box-shadow:0 14px 30px -22px rgba(38,25,15,.5)}
.ph{background-size:cover;background-position:center;background-color:#d8c8aa;position:relative}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(24,14,8,.42) 0%,rgba(24,14,8,0) 34%,rgba(24,14,8,.12) 55%,rgba(24,14,8,.88) 100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:56px;border-radius:99px;font-family:var(--c);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:transform .15s;background:var(--ink);color:#fff}
.btn:active{transform:scale(.97)}
.btn.sand{background:var(--sand);color:var(--ink)}.btn.w{background:#fff;color:var(--ink)}.btn.o{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--sand)}.btn.sm{height:46px;font-size:12px}.btn.warm{background:var(--warm);color:#fff}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);backdrop-filter:blur(8px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px var(--sand);white-space:nowrap;background:transparent;transition:all .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:none}
.chip:disabled{opacity:.3}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-snap-type:x proximity}.row::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:72px;border-radius:36px;z-index:50;display:flex;align-items:center;justify-content:space-around;padding:0 10px;background:rgba(38,25,15,.8);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 36px -10px rgba(24,14,8,.6),inset 0 0 0 1px rgba(240,207,160,.3);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.screen[data-tb=off] .tabbar{transform:translateY(130px);opacity:0;pointer-events:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--c);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 8px;min-width:56px;transition:color .2s}
.tab[aria-current=true]{color:var(--lsand)}
.tab.kf{width:64px;height:64px;min-width:64px;border-radius:50%;background:linear-gradient(135deg,#f5d9ae,#E9A25A 60%,#A75C29);color:var(--ink);margin-top:-30px;border:4px solid var(--bg);justify-content:center;box-shadow:0 10px 24px -6px rgba(167,92,41,.8);padding:0}
.bar{display:flex;align-items:center;gap:12px;padding:0 20px 14px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);box-shadow:0 4px 14px -4px rgba(38,25,15,.4)}
.back.glass{background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.dk .back{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:24px;padding:16px;position:relative;overflow:hidden;min-height:140px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);background:var(--paper)}
.big{font-family:var(--f);font-weight:400;font-size:38px;letter-spacing:-.01em;line-height:.95}.big small{font-size:.38em;letter-spacing:0;margin-left:3px;color:var(--mut);font-weight:400}
.pulse{width:9px;height:9px;border-radius:50%;background:#3DBE86;position:relative;display:inline-block;flex:none}
.pulse:after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3DBE86;animation:pl 1.8s infinite}
@keyframes pl{from{transform:scale(.4);opacity:1}to{transform:scale(1.7);opacity:0}}
.mq{overflow:hidden;white-space:nowrap;font-family:var(--c);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:11px}
.mq div{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;border-radius:30px 30px 0 0;padding:10px 20px 32px;transform:translateY(105%);transition:transform .6s cubic-bezier(.2,.85,.25,1);background:var(--paper);box-shadow:0 -24px 50px rgba(24,14,8,.45);color:var(--ink);max-height:92%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}.sheet .grab{width:48px;height:5px;border-radius:3px;background:var(--sand);margin:0 auto 16px}
.scrim{position:absolute;inset:0;z-index:54;background:rgba(24,14,8,.5);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.stepper{display:flex;align-items:center;gap:14px}.stepper button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--sand);font-size:22px;font-weight:500;display:grid;place-items:center}
.stepper b{font-family:var(--f);font-size:32px;font-weight:300;min-width:26px;text-align:center}
.kv{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;gap:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}.kv span:last-child{text-align:right;font-weight:700}
.msg{max-width:84%;padding:11px 16px;border-radius:20px;font-size:15.5px;line-height:1.45;animation:up .5s both}
.msg.in{background:#fff;border-bottom-left-radius:6px;align-self:flex-start;box-shadow:0 4px 14px -8px rgba(38,25,15,.5)}
.msg.out{background:var(--ink);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg small{display:block;font-size:11.5px;opacity:.5;margin-top:5px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.msg .acts button{font-size:13.5px;font-weight:700;padding:7px 14px;border-radius:99px;background:var(--sand)}
.typing{display:flex;gap:4px;padding:15px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.4;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.2}30%{opacity:.9}}
.toast{position:absolute;left:50%;bottom:116px;transform:translate(-50%,20px);z-index:80;padding:12px 20px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px var(--sand)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.kenb{position:absolute;inset:-6%;background-size:cover;background-position:50% 50%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16) translate(-2%,-1%)}}
.keybtn{position:relative;width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f5d9ae,#E9A25A 55%,#A75C29);color:var(--ink);display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .2s,background .3s;flex:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.3)}
.keybtn:active{transform:scale(.95)}.keybtn.ok{background:#2f9e6c;color:#fff}
.keybtn svg.rg{position:absolute;inset:-12px;width:136px;height:136px;transform:rotate(-90deg)}
.keybtn .rp{position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:0}.keybtn.ok .rp{animation:rip 1.2s infinite}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.chk{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--sand);display:grid;place-items:center;flex:none;transition:all .25s;color:transparent;background:#fff}
.chk.on{background:var(--ink);color:var(--lsand);box-shadow:none}
.seg{display:flex;background:#EFE4D0;border-radius:99px;padding:4px;gap:2px}.seg button{flex:1;text-align:center;padding:9px 6px;border-radius:99px;font-weight:700;font-size:13.5px;transition:all .2s;color:var(--mut)}.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.toggle{width:52px;height:30px;border-radius:99px;background:rgba(38,25,15,.2);position:relative;transition:background .25s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.toggle[aria-pressed=true]{background:#2f9e6c}.toggle[aria-pressed=true]:after{transform:translateX(22px)}
.pass{background:linear-gradient(160deg,#3d2a1b,var(--ink) 60%,#1a0f08);color:#fff;border-radius:30px;position:relative;box-shadow:0 22px 40px -18px rgba(38,25,15,.85)}
.pass:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,var(--sand),#f3e3c6,var(--sand));border-radius:30px 30px 0 0}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.25);margin:0 22px}
.perf:before,.perf:after{content:"";position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.perf:before{left:-36px}.perf:after{right:-36px}
.fld .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.6;font-weight:700}.fld .v{font-family:var(--f);font-weight:500;font-size:19px;margin-top:2px}
.gl{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.heat{display:flex;gap:5px}.heat i{width:28px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .5s}.heat i.on{background:linear-gradient(90deg,#f0b46a,var(--warm))}
.heat.ice i.on{background:linear-gradient(90deg,#bfe6f2,var(--ice))}
.vapor{position:absolute;left:0;right:0;bottom:0;height:60%;background:radial-gradient(60% 80% at 30% 100%,rgba(255,255,255,.25),transparent),radial-gradient(50% 70% at 75% 100%,rgba(255,255,255,.2),transparent);animation:vp 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes vp{from{transform:translateY(8%) scale(1);opacity:.6}to{transform:translateY(-6%) scale(1.15);opacity:1}}
.breath{position:relative;width:250px;height:250px;margin:0 auto;display:grid;place-items:center}
.breath .o,.breath .m2,.breath .c{position:absolute;border-radius:50%}
.breath .o{inset:0;border:1.5px solid rgba(255,255,255,.35)}
.breath .m2{inset:30px;border:1px solid rgba(255,255,255,.2)}
.breath .c{width:120px;height:120px;background:radial-gradient(circle at 35% 30%,#f3e3c6,var(--sand) 65%,#7e7050);box-shadow:0 0 60px rgba(240,207,160,.55);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath.in .c{transform:scale(1.75)}.breath.hold .c{transform:scale(1.75);transition-duration:.2s}.breath.out .c{transform:scale(1);transition-duration:8s}
@media(max-width:1080px){.layout{grid-template-columns:200px 1fr 0}.notes{display:none}}

var NOTES={
welcome:["Arrival","Welcome","Firefall Ranch, 55 cottages and villas on 300 wooded acres near Yosemite, in its own colours: firelight, bark and pine.",["The slow drift is the glowing Yosemite &lsquo;firefall&rsquo; the ranch is named after, from the hotel&rsquo;s own gallery.","A ticker with the facts guests pick the ranch for: 300 acres, 55 cottages and villas, about 30 minutes to the Big Oak Flat entrance, Jackrabbit Ridge sunsets, no hidden resort fees.","The guest opens the stay from the booking e-mail, or from the button below."],"The first screen should sell the place and give one clear next step, not ask for a login."],
home:["Arrival","Today & key card","Arrival day as a key card with a hold-to-unlock button (try it), then tonight&rsquo;s plan.",["Real: the ranch has five villages across 300 wooded acres, and a daily activities calendar guests get on arrival; the app can hold it.","Cottage number, guest, dates, weather and the sunset time are placeholders. The stay dates (23 to 26 September 2027) were chosen so Jackrabbit Ridge (Thursday to Sunday, spring to fall) is open.","The pill at the top is a Live Activity for the ridge pick-up (tap it)."],"With a stay spread over five villages and a park outside the gate, the front desk answers the same questions all day. Today puts the answers in one place."],
room:["Arrival","Cottage & upgrades","A cottage with a private deck and an indoor fireplace, the product the ranch describes, with the key on the phone.",["Real: studio to multi-bedroom cottages and villas, sleeping 2 to 8, with a separate living area, a private deck, an indoor fireplace and kitchenettes or full kitchens in select units.","Real: the Doggie Daily rate covers up to two dogs and includes dog beds, water bowls and crates.","Cottage names, layouts and photos on the upgrade cards are representative; the site does not publish a unit list, so none is shown as fact. Fireplace and pet-kit buttons are concept features."],"A guest who can open the door, order a trail lunch and see the next category up without calling is a guest who books the bigger cottage next time."],
ridge:["Evening","Jackrabbit Ridge sunset","Drag the clock to watch the sky over the ridge change, then reserve a perch.",["Real: a private hilltop above the ranch; four alcoves for up to two guests and The Overlook for up to four; $125 per person, bookings 6 to 8 PM, Thursday to Sunday, spring through fall, weather permitting.","Real: the charcuterie board, transport to and from the ridge, a portable speaker and seating are included; meet at reception 15 minutes before; gratuity not included; stargazing after sunset is $45 per person.","Sunset and golden-hour times are illustrative for late September; a live version would calculate them per day."],"This is the ranch&rsquo;s most distinctive evening and it is reserved by phone or e-mail today. A booking sheet with a visible price and status turns it into an upsell."],
dine:["Evening","Dining","YOVA, the Tavern, the Wine Room and the General Store, with a booking sheet.",["Real: YOVA serves dinner 5 to 9 PM daily, reservation required, open-flame hardwood grilling; the Tavern serves breakfast 7 to 11 AM, lunch and dinner 12 to 4 PM and 5 to 9 PM, has 12 beers on tap and Golden Hour 4 to 6 PM; the General Store is open 7 AM to 10 PM.","Real: the Wine Room seats up to 14 and the Private Dining Room up to 40; group requests go to groups@firefallranch.com.","Seating times are illustrative; today a table is requested on OpenTable or by e-mail. The poolside order button is a concept."],"Dining is requested by e-mail and OpenTable today. One tap with a confirmed status gives the guest an answer and the team fewer messages."],
park:["Yosemite & the ranch","Yosemite day planner","From the ranch to the park gate, with a plan for the day and a trail lunch.",["Real: about 30 minutes to the Big Oak Flat entrance, Groveland 7.5 miles away, the nearest gas going east is Crane Flat, 9.5 miles inside the park.","Real: the ranch warns that GPS and online maps can be unreliable around it; this screen is where the right directions would live.","Real: the three plans reflect the site&rsquo;s own 2 to 4 day suggestions (Yosemite Falls, El Capitan, Tunnel View, Glacier Point, Mariposa Grove) and its list of guided excursions. The route is a schematic, not to scale."],"Guests come for Yosemite. A day plan, a trail lunch and a guide request in the app is the service the front desk gives at 7 AM, before most of the team is in."],
play:["Yosemite & the ranch","Activities","The ranch&rsquo;s own activities in one switcher: make and ride, play, and evenings.",["Real: glass blowing, horseback riding, gold panning, arts and crafts, forest disc golf, mini golf, a bouldering area, beach volleyball, complimentary cruiser bikes (spring to fall), the heated pool and hot tubs, fireside s&rsquo;mores, stargazing and wine tasting.","Glass blowing and horseback cards open a request; the others save to the stay. Class times are illustrative; the ranch posts a daily calendar that can change.","The photo for the property map is the hotel&rsquo;s own."],"The ranch advertises free and low-cost activities instead of resort fees. The app is where guests find them without hunting for the printed calendar."],
spa:["Restore","Rush Creek spa","The spa at the sister property, Rush Creek Lodge, 15 miles from the ranch.",["Real: the ranch points guests to the Rush Creek Lodge spa: an aromatherapy steam room, a Himalayan salt block sauna, a cool mist shower, a sensory room and warm waterfall coves.","Treatment names and times are illustrative; the ranch does not publish a menu on its own site.","Book a visit; it appears in the stay as requested."],"The ranch has no spa of its own. Making the sister property one tap away keeps the guest in the family."],
chat:["Stay","Concierge chat","An answer bot built on the ranch&rsquo;s own guest information, with the team behind it.",["Try &lsquo;dogs&rsquo;, &lsquo;gps&rsquo;, &lsquo;yova&rsquo;, &lsquo;golden hour&rsquo;, &lsquo;ridge&rsquo;, &lsquo;ev charging&rsquo; or &lsquo;spa&rsquo;.","Answers use the real hours and policies from the website.","Anything else goes to the reservations team: live from 7 AM to 7 PM Pacific, daily."],"The same questions come in every day, and the ranch already has the answers written down. The app gives them in a second."],
checkout:["Stay","Check-out","The folio and a thank-you.",["Real: the ranch advertises no hidden resort fees; the resort-fee line shows none.","The cottage rate is a placeholder; the hotel does not publish rates. Ridge prices are the real $125 and $45 per person; other requests show as to be confirmed.","The next stay is one tap away."],"A clear folio and a next-stay offer close the stay well, before the guest has left the ranch."]};
